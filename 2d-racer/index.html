<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Racer - Arcade Racing Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        canvas { 
            background: #222; 
            image-rendering: pixelated; 
            border: 4px solid #ff0;
            box-shadow: 0 0 20px #ff0;
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            z-index: 10; 
        }
        #shield { font-weight: bold; color: #0f0; }
        #crash-anim { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 5; 
            display: none; 
        }
    </style>
</head>
<body>
    <div id="ui">
        <span id="score">Score: 0</span> |
        <span id="shield">Shield: <strong>OFF</strong></span>
    </div>
    <canvas id="game"></canvas>
    <div id="crash-anim"></div>
    <script>
        /* ---------- CONFIG ---------- */
        const CONFIG = {
            carSpeed: 4,
            shieldDuration: 3000,
            shieldCooldown: 5000,
            obstacleSpeed: 2,
            obstacleSpawnRate: 1500,
            crashFrames: 10,
            vehicleTypes: [
                {name:'car', w:40, h:20, color:'#ff5555'},
                {name:'truck', w:55, h:30, color:'#5555ff'},
                {name:'tractor', w:45, h:35, color:'#55ff55'},
                {name:'motorbike', w:30, h:25, color:'#ffaa55'}
            ]
        };
        let canvas, ctx;
        let car = {x:0, y:0, w:40, h:20, speed:0, dx:0, shield:false, shieldEnd:0};
        let obstacles = [];
        let score = 0;
        let shieldActive = false;
        let crashAnim = document.getElementById('crash-anim');
        let crashFramesLeft = 0;
        let lastTime = 0;
        let keys = {};
        let level = 1;
        let levelGoal = 500;
        
        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);
        
        function init() {
            canvas = document.getElementById('game');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
            requestAnimationFrame(loop);
            spawnObstacle();
            spawnShield();
        }
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            car.x = canvas.width/2 - CONFIG.carSpeed; 
            car.y = canvas.height - 60;
        }
        function handleInput(dt) {
            if(keys['ArrowLeft']) car.dx = -CONFIG.carSpeed;
            else if(keys['ArrowRight']) car.dx = CONFIG.carSpeed;
            else car.dx = 0;
        }
        function spawnObstacle() {
            const type = CONFIG.vehicleTypes[Math.floor(Math.random()*CONFIG.vehicleTypes.length)];
            obstacles.push({
                type,
                x: Math.random() * (canvas.width - type.w),
                w: type.w,
                h: type.h,
                speed: CONFIG.obstacleSpeed + (score/2000),
                passed:false
            });
        }
        function triggerCrash(x,y) {
            crashAnim.style.display='block';
            crashAnim.style.left = x + 'px';
            crashAnim.style.top = y + 'px';
            crashFramesLeft = CONFIG.crashFrames;
            const beep = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=');
            beep.play();
        }
        function render() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            obstacles.forEach(obs=>{
                ctx.fillStyle = obs.type.color;
                ctx.fillRect(obs.x, canvas.height - obs.h, obs.w, obs.h);
                if(obs.type.name==='car'){
                    ctx.fillStyle='#fff';
                    ctx.fillRect(obs.x+10, canvas.height-obs.h+5, 5, 5);
                }
                ctx.fillStyle='rgba(0,0,0,0.3)';
                ctx.fillRect(obs.x, canvas.height-obs.h+1, obs.w, 1);
            });
            ctx.fillStyle = '#0f0';
            ctx.fillRect(car.x, car.y, car.w, car.h);
            if(shieldActive){
                ctx.fillStyle='rgba(0,255,0,0.3)';
                ctx.fillRect(car.x-5, car.y-5, car.w+10, car.h+10);
            }
            ctx.fillStyle='#fff';
            ctx.font='14px Arial';
            ctx.fillText('Score: '+score, 10, 20);
            ctx.fillText('Level: '+level, 10, 40);
            ctx.fillText('Goal: '+levelGoal, 10, 60);
            ctx.fillText('Shield: '+ (shieldActive?'ON':'OFF'), 10, 80);
        }
        function updateCrashAnim() {
            if(crashFramesLeft<=0){
                crashAnim.style.display='none';
                return;
            }
            const size = 200 * (crashFramesLeft/CONFIG.crashFrames);
            crashAnim.style.width = size+'px';
            crashAnim.style.height = size+'px';
            crashAnim.style.border = '2px solid #ff0';
            crashAnim.style.borderRadius = '50%';
            crashAnim.style.background = 'radial-gradient(circle, #ff0, transparent)';
            crashFramesLeft--;
        }
        function loop(timestamp){
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            handleInput();
            car.x += car.dx;
            if(car.x < 0) car.x = 0;
            if(car.x + car.w > canvas.width) car.x = canvas.width - car.w;
            obstacles.forEach((obs,i)=>{
                obs.y = canvas.height - obs.h;
                obs.y -= obs.speed;
                if(car.shield && obs.passed===false){
                    obs.passed = true;
                    score += 10;
                    document.getElementById('score').textContent='Score: '+score;
                    return;
                }
                const carRect = {x:car.x, y:car.y, w:car.w, h:car.h};
                const obsRect = {x:obs.x, y:obs.y, w:obs.w, h:obs.h};
                if(carRect.x < obsRect.x + obsRect.w &&
                   carRect.x + carRect.w > obsRect.x &&
                   carRect.y < obsRect.y + obsRect.h &&
                   carRect.y + carRect.h > obsRect.y){
                    if(!car.shield){
                        triggerCrash(car.x+car.w/2, car.y+car.h/2);
                        score = 0;
                        document.getElementById('score').textContent='Score: 0';
                        shieldActive = false;
                        document.getElementById('shield').innerHTML='Shield: OFF';
                        obstacles = [];
                        spawnObstacle();
                    } else {
                        obstacles.splice(i,1);
                        score += 20;
                        document.getElementById('score').textContent='Score: '+score;
                    }
                }
            });
            obstacles = obstacles.filter(o=>!o.passed);
            if(timestamp - (lastTime - dt) > CONFIG.obstacleSpawnRate - (score*0.5)){
                spawnObstacle();
            }
            if(shieldActive && Date.now() > car.shieldEnd){
                shieldActive = false;
                car.speed = CONFIG.carSpeed;
            }
            render();
            if(crashFramesLeft>0) updateCrashAnim();
            requestAnimationFrame(loop);
        }
        let pointerDown = false;
        let startX = 0;
        canvas.addEventListener('pointerdown', e=>{
            pointerDown = true;
            startX = e.clientX;
        });
        canvas.addEventListener('pointerup', e=>{ pointerDown = false; });
        canvas.addEventListener('pointermove', e=>{
            if(!pointerDown) return;
            const dx = e.clientX - startX;
            car.dx = dx * 0.02;
        });
        function spawnShield() {
            const shieldX = Math.random() * (canvas.width-30);
            const shieldY = -30;
            const shieldSize = 30;
            const carRect = {x:car.x, y:car.y, w:car.w, h:car.h};
            const shieldRect = {x:shieldX, y:shieldY, w:shieldSize, h:shieldSize};
            if(carRect.x < shieldRect.x + shieldRect.w &&
               carRect.x + carRect.w > shieldRect.x &&
               carRect.y < shieldRect.y + shieldRect.h &&
               carRect.y + carRect.h > shieldRect.y){
                shieldActive = true;
                car.shieldEnd = Date.now() + CONFIG.shieldDuration;
                document.getElementById('shield').innerHTML='Shield: ON';
                setTimeout(()=>{ if(!shieldActive) document.getElementById('shield').innerHTML='Shield: OFF'; }, CONFIG.shieldDuration);
            }
            setTimeout(spawnShield, CONFIG.shieldCooldown + (score*100));
        }
        spawnShield();
        init();
    </script>
</body>
</html>
