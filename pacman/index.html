<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man - Classic Arcade Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game { 
            border: 4px solid #ff0; 
            box-shadow: 0 0 20px #ff0;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff0;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="overlay">PRESS ENTER TO START</div>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let pacman = { x: 200, y: 200, dir: 0, speed: 2 };
        let ghosts = [];
        let score = 0;
        let gameRunning = false;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                gameRunning = true;
                document.getElementById('overlay').style.display = 'none';
            }
            if (e.key === 'ArrowLeft') pacman.dir = -1;
            if (e.key === 'ArrowRight') pacman.dir = 1;
            if (e.key === 'ArrowUp') pacman.dir = -2;
            if (e.key === 'ArrowDown') pacman.dir = 2;
        });
        
        function drawPacman() {
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(pacman.x, pacman.y, 10, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.lineTo(pacman.x, pacman.y);
            ctx.fill();
        }
        
        function drawGhosts() {
            ghosts.forEach(g => {
                ctx.fillStyle = g.color;
                ctx.beginPath();
                ctx.arc(g.x, g.y, 10, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function update() {
            if (!gameRunning) return;
            pacman.x += pacman.dir * pacman.speed;
            if (pacman.x < 0 || pacman.x > 400) pacman.dir *= -1;
            ghosts.forEach(g => {
                g.x += (pacman.x - g.x) * 0.02;
                g.y += (pacman.y - g.y) * 0.02;
            });
            drawPacman();
            drawGhosts();
            requestAnimationFrame(update);
        }
        
        update();
    </script>
</body>
</html>
